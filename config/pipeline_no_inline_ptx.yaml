compilation:
  compile_timeout: 120
  disasm_timeout: 60
  jobs_compile: 8
  jobs_disasm: 8
  jobs_generate: 4
  ptx_timeout: 60
  retries: 2
  verify_sass_diversity: true
corpus:
  accepted_dir: corpus/accepted
  differential_dir: corpus/differentials
  rejected_dir: corpus/rejected
execution:
  device_memory_guard_words: 8
  gpu_devices: []
  gpu_workers_per_device: 1
  run_timeout: 60
  runner_restart_after: 0
  runs_per_build: 3
generation:
  backlog_target: 64
  batch_size: 8
  config_seed: 20260810
  generator_version: 1.1.0
  max_cases: 0
  mutation_ratio: 0.35
  oracle_workers: 8
novelty:
  compile_time_penalty: 0.05
  control_flow_complexity: 0.5
  duplicate_penalty: 2.0
  optimization_delta: 1.5
  predicate_pressure: 0.6
  rare_opcode_bonus: 0.7
  register_pressure: 0.5
  sass_novelty: 1.0
oracle:
  comparison_policy: exact_u64
  reject_on_oracle_mismatch: true
  verify_input_sensitivity: true
project:
  root: ''
  run_id: ''
reporting:
  ledger: results.jsonl
  results_dir: runs
scheduling:
  adaptive_weights: true
  strategy_weights:
    integer_chain: 1.0
    memory_address: 0.8
    predicate_pressure: 1.0
    register_pressure: 0.9
    warp_mixed: 0.8
storage:
  compress_bug_archives: true
  delete_redundant_cubin: true
  delete_redundant_ptx: true
  gc_interval_cases: 25
  keep_invalid_samples_per_reason: 20
  keep_passing_sources: 800
  max_total_gb: 40
stress_gate:
  min_distinct_sass_hashes: 2
  min_optimization_delta: 0.15
  min_ptx_lines: 40
  min_sass_instructions: 50
  require_input_sensitivity: true
  target_opcode_present: true
