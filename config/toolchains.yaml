# Toolchains: arbitrary N CUDA toolkits.
# runnable: whether this toolkit's CUBIN (and PTX-JIT) can execute on the host driver.
#   On this machine the driver UMD is 12.1; CUDA 13.x cubins and PTX ISA 8.5+ are rejected,
#   so 13.0/13.3 are compile+analyze only.  `pipeline probe` recomputes these flags.
#
# `arch` is the target GPU architecture (sm_86 == RTX 2050, Ampere).
toolchains:
  - id: cuda-11.3
    root: /usr/local/cuda-11.3
    nvcc: /usr/local/cuda-11.3/bin/nvcc
    ptxas: /usr/local/cuda-11.3/bin/ptxas
    nvdisasm: /usr/local/cuda-11.3/bin/nvdisasm
    cuobjdump: /usr/local/cuda-11.3/bin/cuobjdump
    arch: sm_86
    ccbin: /usr/bin/gcc-8
    runnable: true

  - id: cuda-11.8
    root: /usr/local/cuda-11.8
    nvcc: /usr/local/cuda-11.8/bin/nvcc
    ptxas: /usr/local/cuda-11.8/bin/ptxas
    nvdisasm: /usr/local/cuda-11.8/bin/nvdisasm
    cuobjdump: /usr/local/cuda-11.8/bin/cuobjdump
    arch: sm_86
    ccbin: /usr/bin/gcc-8
    runnable: true

  - id: cuda-12.1
    root: /usr/local/cuda-12.1
    nvcc: /usr/local/cuda-12.1/bin/nvcc
    ptxas: /usr/local/cuda-12.1/bin/ptxas
    nvdisasm: /usr/local/cuda-12.1/bin/nvdisasm
    cuobjdump: /usr/local/cuda-12.1/bin/cuobjdump
    arch: sm_86
    ccbin: /usr/bin/gcc-11
    runnable: true

  - id: cuda-12.6
    root: /usr/local/cuda-12.6
    nvcc: /usr/local/cuda-12.6/bin/nvcc
    ptxas: /usr/local/cuda-12.6/bin/ptxas
    nvdisasm: /usr/local/cuda-12.6/bin/nvdisasm
    cuobjdump: /usr/local/cuda-12.6/bin/cuobjdump
    arch: sm_86
    ccbin: /usr/bin/gcc-11
    runnable: true


# ptxas optimization profiles.  O4 is NOT listed: probing proved -Xptxas=-O4 is silently
# accepted on every toolkit but produces SASS byte-identical to O3 (O4 is an alias of O3,
# not a real optimization level).  The framework supports arbitrary M profiles; only real,
# behaviorally distinct ones belong here.
optimization_profiles:
  - { name: O0, ptxas_opt: 0 }
  - { name: O1, ptxas_opt: 1 }
  - { name: O2, ptxas_opt: 2 }
  - { name: O3, ptxas_opt: 3 }
