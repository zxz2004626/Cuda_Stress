id: miscompile-all-cicc-mulnarrow0
title: cicc moves multiply across char narrowing (3*(char)(c-129) -> 3*c+381), breaking unsigned rem
class: miscompile
component: cicc/NVVM front-end optimizer (not ptxas)
trigger_opt: [O0, O1, O2]
correct_value: "0"
buggy_value: "1"
arch_verified: sm_86
range_sm86:
  introduced: "<=12.5"
  last_bad: "12.6"
  fixed_in: "12.8"
  note: |
    wrong at every -Xptxas level (bug is in the front-end PTX); nvcc -G is
    correct on 12.5/12.6; 13.0..13.3 correct. CUDA 12.7 does not exist (NVIDIA
    skipped it). 12.8.2 and 12.9.2 verified via docker (nvidia/cuda
    devel-ubuntu22.04, static-cudart build run on host driver 590.48): both
    correct at O0/O2.
root_cause: |
  cicc rewrites 3*(char)(*i-129) as 3*(*i)+381 (mad.lo.s32 %r, %r, 3, 381),
  distributing the multiply across the narrowing char conversion and dropping
  the truncation. The value shifts by 768 = 3*256, congruence-preserving
  mod 3; the pass assumes the only consumer is %3, but the consumer is an
  unsigned rem.u32 on the two's-complement representation, where the rewrite
  changes the remainder (0xFFFFFE80u % 3u = 1 vs 0x180u % 3u = 0).
  A dead __ldg(i) statement is required to make the pass fire.
trigger_quirks:
  - "dead __ldg(i) load must be present to trigger"
